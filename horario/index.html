<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horario del día</title>
<link rel="stylesheet" href="../shared/base.css">
<style>
  html, body { overflow: hidden; }

  #list {
    height: 100vh;
    overflow-y: auto;
    scrollbar-width: none;
    padding: calc(50vh - 44px) 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22%, #000 78%, transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0, #000 22%, #000 78%, transparent 100%);
  }
  #list::-webkit-scrollbar { display: none; }

  .item {
    flex: none;
    padding: 10px 14px;
    border-radius: 10px;
    border-left: 3px solid transparent;
    opacity: var(--op, 1);
    transition: opacity .6s, background-color .6s, border-color .6s, padding .4s;
  }
  .time {
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: .02em;
  }
  .title {
    font-size: 15px;
    line-height: 1.35;
    margin-top: 2px;
    overflow-wrap: anywhere;
    transition: font-size .4s;
  }
  .meta { font-size: 12px; color: var(--muted); margin-top: 4px; display: none; }
  .bar { height: 4px; border-radius: 4px; background: var(--line); margin-top: 8px; overflow: hidden; display: none; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width 1s linear; }

  .item.current {
    background: var(--surface);
    border-left-color: var(--accent);
    padding: 14px 16px;
  }
  .item.current .title { font-size: clamp(17px, 5vw, 22px); font-weight: 600; }
  .item.current .meta, .item.current .bar, .item.next .meta { display: block; }

  .item.gap { padding-top: 4px; padding-bottom: 4px; }
  .item.gap .title { font-size: 13px; color: var(--muted); font-style: italic; }
  .item.gap.current .title { font-size: 16px; font-weight: 500; }

  #empty {
    display: none;
    height: 100vh;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.5;
  }
  #empty a { color: var(--accent); }

  #edit {
    position: fixed;
    top: 8px;
    right: 8px;
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 6px;
    background: var(--surface);
    color: var(--muted);
    text-decoration: none;
    opacity: 0;
    transition: opacity .2s;
  }
  body:hover #edit, #edit:focus { opacity: 1; }
  @media (hover: none) { #edit { opacity: .6; } }
</style>
</head>
<body>
<div id="list"></div>
<div id="empty"></div>
<a id="edit" href="editor.html" target="_blank" rel="noopener">✎ Editar</a>

<script src="../shared/params.js"></script>
<script src="schedule.js"></script>
<script>
  const list = document.getElementById("list");
  const empty = document.getElementById("empty");
  const edit = document.getElementById("edit");

  // Para probar: ?now=14:30 fija la hora, ?day=1 fija el día (0 = domingo).
  const fixedNow = W.query("now");
  const fixedDay = W.query("day");

  let data, items = [], els = [], builtFor = null, lastCurrent = -1;
  let lastUser = 0, autoScrolling = false;

  function clock() {
    const d = new Date();
    let min = d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
    let day = d.getDay();
    if (fixedNow) {
      const [h, m] = fixedNow.split(":");
      min = +h * 60 + +(m || 0);
    }
    if (fixedDay !== null && fixedDay !== "") day = +fixedDay;
    return { min, day };
  }

  function load() {
    data = W.hashData() || {};
    W.applyLook(data);
    edit.href = "editor.html" + location.hash;
    builtFor = null;
    tick(true);
  }

  // Arma la lista del día: bloques de hoy, lo que viene de anoche (23:00-07:00) y huecos libres.
  function build(day) {
    const today = Schedule.parse(Schedule.textFor(data, day)).blocks;
    const fromYesterday = Schedule.parse(Schedule.textFor(data, (day + 6) % 7)).blocks
      .filter((b) => b.e > 1440)
      .map((b) => ({ s: b.s - 1440, e: b.e - 1440, t: b.t }));
    const blocks = [...fromYesterday, ...today].sort((a, b) => a.s - b.s);

    items = [];
    if (blocks.length) {
      let cursor = Math.min(0, blocks[0].s);
      for (const b of blocks) {
        if (b.s - cursor >= 1) items.push({ s: cursor, e: b.s, t: "Libre", gap: true });
        items.push(b);
        cursor = Math.max(cursor, b.e);
      }
      if (1440 - cursor >= 1) items.push({ s: cursor, e: 1440, t: "Libre", gap: true });
    }

    const hasSchedule = !!(data.all || data.days);
    list.style.display = items.length ? "" : "none";
    empty.style.display = items.length ? "none" : "flex";
    empty.innerHTML = hasSchedule
      ? "No hay horario para hoy."
      : `Todavía no cargaste tu horario.<br><a href="editor.html" target="_blank" rel="noopener">Armarlo acá</a>`;

    const order = data.order === "past-bottom" ? [...items].reverse() : items;
    list.innerHTML = "";
    els = items.map(() => null);
    order.forEach((it) => {
      const el = document.createElement("div");
      el.className = "item" + (it.gap ? " gap" : "");
      el.innerHTML = `<div class="time"></div><div class="title"></div><div class="meta"></div><div class="bar"><i></i></div>`;
      el.querySelector(".time").textContent = `${Schedule.fmt(it.s)} – ${Schedule.fmt(it.e)}`;
      el.querySelector(".title").textContent = it.gap ? `Libre · ${Schedule.dur(it.e - it.s)}` : it.t;
      list.appendChild(el);
      els[items.indexOf(it)] = el;
    });
    lastCurrent = -1;
  }

  function update(min) {
    let cur = -1;
    items.forEach((it, i) => { if (it.s <= min && min < it.e) cur = i; });

    items.forEach((it, i) => {
      const el = els[i];
      const dist = cur < 0 ? 0 : Math.abs(i - cur);
      el.style.setProperty("--op", [1, 0.5, 0.3, 0.2][Math.min(dist, 3)]);
      el.classList.toggle("current", i === cur);
      el.classList.toggle("next", i === cur + 1);
      const meta = el.querySelector(".meta");
      if (i === cur) {
        const nextReal = items.slice(i + 1).find((x) => !x.gap);
        meta.textContent = it.gap && nextReal
          ? `Próximo: ${nextReal.t} en ${Schedule.dur(it.e - min)}`
          : `Quedan ${Schedule.dur(it.e - min)} · hasta ${Schedule.fmt(it.e)}`;
        el.querySelector(".bar i").style.width = (((min - it.s) / (it.e - it.s)) * 100).toFixed(2) + "%";
      } else if (i === cur + 1) {
        meta.textContent = `En ${Schedule.dur(it.s - min)}`;
      }
    });

    if (cur !== lastCurrent) {
      const first = lastCurrent === -1;
      lastCurrent = cur;
      center(!first);
    }
  }

  function center(smooth) {
    const el = els[lastCurrent];
    if (!el) return;
    const top = el.offsetTop - list.offsetTop + el.offsetHeight / 2 - list.clientHeight / 2;
    if (Math.abs(list.scrollTop - top) < 3) return;
    autoScrolling = true;
    list.scrollTo({ top, behavior: smooth ? "smooth" : "auto" });
    setTimeout(() => (autoScrolling = false), 800);
  }

  function tick(force) {
    const { min, day } = clock();
    if (force || builtFor !== day) {
      build(day);
      builtFor = day;
    }
    update(min);
    // Si el usuario scrolleó, vuelve al bloque actual después de 5 segundos quieto.
    if (data.recenter !== false && !autoScrolling && Date.now() - lastUser > 5000) center(true);
  }

  ["wheel", "touchstart", "touchmove", "pointerdown", "keydown"].forEach((ev) =>
    list.addEventListener(ev, () => (lastUser = Date.now()), { passive: true })
  );
  window.addEventListener("hashchange", load);
  window.addEventListener("resize", () => center(false));

  load();
  setInterval(tick, 1000);
</script>
</body>
</html>
